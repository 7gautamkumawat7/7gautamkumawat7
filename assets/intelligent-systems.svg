<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Intelligent Systems</title>
  <desc id="desc">An electric-blue circuit connects interface, API, and data layers. Animated signals travel along the connections.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .signal { stroke-dasharray: 7 45; animation: transmit 4s linear infinite; }
    @keyframes transmit { to { stroke-dashoffset: -104; } }
    @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
  </style>
  <rect width="960" height="240" fill="#090d14" />
  <path d="M0 0H960M0 239H960" stroke="#253344" />
  <path d="M30 40V24H46M930 200V216H914" fill="none" stroke="#38bdf8" stroke-width="2" />
  <g fill="#38bdf8">
    <text x="46" y="51" font-size="13" font-weight="700">FULL STACK / DATA / AI EXPLORATION</text>
  </g>
  <g fill="#f1f5f9" font-size="43" font-weight="700">
    <text x="46" y="111">INTELLIGENT</text>
    <text x="46" y="161">SYSTEMS</text>
  </g>
  <text x="46" y="203" fill="#a7b3c4" font-size="16">Thoughtful interfaces. Reliable foundations.</text>
  <g fill="none" stroke="#244968" stroke-width="1.5">
    <path d="M586 79H624L692 119H734L810 64H861" />
    <path d="M586 163H624L692 119H734L810 164H861" />
