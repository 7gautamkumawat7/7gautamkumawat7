    <rect x="575" y="152" width="22" height="22" rx="3" />
    <rect x="690" y="101" width="36" height="36" rx="4" />
    <rect x="850" y="53" width="22" height="22" rx="3" />
    <rect x="850" y="153" width="22" height="22" rx="3" />
